<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Horseplay — Make 'em dance! A 6×6 knight’s tour by KingFeddy.">
  <title>Horseplay · KingFeddy</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=horseplay-3">
</head>
<body>
<main id="knights-tour-game" aria-label="Horseplay">
  <nav><a href="https://github.com/KingFeddy">← KingFeddy on GitHub</a><span>6 × 6</span></nav>
  <section class="kt-shell">
    <div class="kt-top"><h1>Horseplay</h1><button type="button" class="kt-pause" hidden>Pause animation</button></div>
    <div class="kt-layout">
      <div class="kt-board" role="group" aria-label="Six by six knight’s tour board" aria-describedby="instructions"><div class="kt-grid"></div><div class="kt-knight" aria-hidden="true"><span><picture><source media="(prefers-color-scheme: dark)" srcset="assets/knight-dark.png"><img src="assets/knight-light.png" width="180" height="180" alt="" draggable="false"></picture></span></div></div>
      <div class="kt-copy"><div class="kt-kicker">YOUR MOVE</div><h2 aria-live="polite" aria-atomic="true">One knight.<br>Every square.<br>Exactly once<span>.</span></h2><div class="kt-count" aria-label="Squares visited"><strong>01</strong><span>/ 36 squares</span></div><button type="button" class="kt-try">Start again <span aria-hidden="true">↻</span></button><button type="button" class="kt-back">Watch a complete tour</button></div>
    </div>
  </section>
  <p id="instructions">Move in an L shape. Land on all 36 squares without repeating one to win</p>
  <noscript>This game needs JavaScript. Enable it, then refresh to play.</noscript>
</main>
<script type="module" src="game.mjs?v=horseplay-5"></script>
</body>
</html>
